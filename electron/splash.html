<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GarageLedger</title>
    <style>
      :root {
        --bg: #fafafa;
        --surface: #f5f0e8;
        --ink: #0f172a;
        --muted: #64748b;
        --border: rgba(15, 23, 42, 0.08);
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: 360px;
        border-radius: 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 24px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        opacity: 0.9;
      }
      .title {
        font-size: 14px;
        font-weight: 650;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
      }
      .pbar {
        height: 6px;
        margin-top: 10px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }
      .pbar > div {
        height: 100%;
        width: 0%;
        background: rgba(17, 24, 39, 0.6);
        border-radius: 999px;
        transition: width 160ms ease;
      }
      .bar {
        height: 3px;
        margin-top: 16px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 40%;
        background: rgba(17, 24, 39, 0.55);
        border-radius: 999px;
        animation: move 1s ease-in-out infinite alternate;
      }
      @keyframes move {
        from {
          transform: translateX(-30%);
        }
        to {
          transform: translateX(140%);
        }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="card">
        <img class="logo" src="../GarageLedger.svg" alt="GarageLedger" />
        <div>
          <div class="title">GarageLedger</div>
          <div class="sub">Cicibyte Corp</div>
          <div id="status" class="status">Başlatılıyor…</div>
          <div class="pbar"><div id="pbar"></div></div>
        </div>
      </div>
    </div>
    <script>
      const statusEl = document.getElementById('status')
      const pbarEl = document.getElementById('pbar')

      function setStatus(text) {
        statusEl.textContent = text
      }
      function setProgress(p) {
        const clamped = Math.max(0, Math.min(100, Number(p) || 0))
        pbarEl.style.width = `${clamped}%`
      }

      function render(payload) {
        if (!payload || !payload.state) return
        switch (payload.state) {
          case 'checking':
            setStatus('Güncelleme kontrol ediliyor…')
            setProgress(8)
            break
          case 'available':
            setStatus('Güncelleme bulundu. İndiriliyor…')
            setProgress(12)
            break
          case 'downloading':
            setStatus(`Güncelleme indiriliyor… %${payload.percent ?? 0}`)
            setProgress(payload.percent ?? 0)
            break
          case 'downloaded':
            setStatus('Güncelleme hazır. Uygulama açılıyor…')
            setProgress(100)
            break
          case 'upToDate':
            setStatus('Uygulama güncel. Açılıyor…')
            setProgress(100)
            break
          case 'dev':
            setStatus('Geliştirme modu. Açılıyor…')
            setProgress(100)
            break
          case 'error':
            setStatus('Güncelleme hatası. Açılıyor…')
            setProgress(100)
            break
          default:
            break
        }
      }

      async function boot() {
        try {
          const api = window.GarageLedger
          if (api?.updates?.getStatus) {
            const s = await api.updates.getStatus()
            render(s)
          }
          api?.updates?.onStatus?.((p) => render(p))
          api?.updates?.check?.()
          api?.backups?.ensureDaily?.()
        } catch {
          setStatus('Açılıyor…')
        }
      }

      boot()
    </script>
  </body>
</html>
