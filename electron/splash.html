<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GarageLedger</title>
    <style>
      :root {
        --bg: #fafafa;
        --surface: #f5f0e8;
        --ink: #0f172a;
        --muted: #64748b;
        --border: rgba(15, 23, 42, 0.08);
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: 360px;
        border-radius: 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 24px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        opacity: 0.9;
      }
      .title {
        font-size: 14px;
        font-weight: 650;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .bar {
        height: 3px;
        margin-top: 16px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 40%;
        background: rgba(17, 24, 39, 0.55);
        border-radius: 999px;
        animation: move 1s ease-in-out infinite alternate;
      }
      @keyframes move {
        from {
          transform: translateX(-30%);
        }
        to {
          transform: translateX(140%);
        }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="card">
        <img class="logo" src="../dist/garageledger.svg" alt="GarageLedger" />
        <div>
          <div class="title">GarageLedger</div>
          <div class="sub">Cicibyte Corp</div>
          <div class="bar"><div></div></div>
        </div>
      </div>
    </div>
  </body>
</html>
