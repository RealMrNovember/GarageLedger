<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GarageLedger</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #111111;
        color: #f5f0e6;
      }
      body {
        opacity: 1;
        transition: opacity 420ms ease;
      }
      body.fade-out {
        opacity: 0;
      }
      .shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px 28px 28px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(201, 162, 39, 0.18));
      }
      .media {
        width: min(320px, 88vw);
        aspect-ratio: 16 / 9;
        border-radius: 16px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(201, 162, 39, 0.22);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      .media video,
      .media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .status {
        font-size: 12px;
        color: #9ca3af;
        min-height: 1.2em;
      }
      .track {
        width: min(280px, 80vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .track > div {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #c9a227, #e8d5a3);
        border-radius: 999px;
        transition: width 200ms ease;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <img class="logo" src="./splash/garageledger.svg" alt="GarageLedger" onerror="this.src='./splash/logo.png'" />
      <div class="media">
        <video id="carVideo" autoplay muted loop playsinline poster="./splash/car.gif">
          <source src="./splash/car.webm" type="video/webm" />
        </video>
      </div>
      <div class="title">GarageLedger</div>
      <div id="status" class="status">Starting…</div>
      <div class="track"><div id="pbar"></div></div>
    </div>
    <script>
      const statusEl = document.getElementById('status')
      const pbarEl = document.getElementById('pbar')
      const video = document.getElementById('carVideo')

      video?.addEventListener('error', () => {
        const img = document.createElement('img')
        img.src = './splash/car.gif'
        img.alt = ''
        video.replaceWith(img)
      })

      function setStatus(text) {
        statusEl.textContent = text
      }
      function setProgress(p) {
        const clamped = Math.max(0, Math.min(100, Number(p) || 0))
        pbarEl.style.width = `${clamped}%`
      }

      function render(payload) {
        if (!payload || !payload.state) return
        switch (payload.state) {
          case 'checking':
            setStatus('Checking for updates…')
            setProgress(12)
            break
          case 'available':
            setStatus('Update found. Downloading…')
            setProgress(18)
            break
          case 'downloading':
            setStatus(`Downloading update… ${payload.percent ?? 0}%`)
            setProgress(payload.percent ?? 0)
            break
          case 'downloaded':
            setStatus('Update ready. Loading workspace…')
            setProgress(92)
            break
          case 'upToDate':
            setStatus('Loading workspace…')
            setProgress(88)
            break
          case 'dev':
            setStatus('Development mode…')
            setProgress(70)
            break
          case 'error':
            setStatus('Loading workspace…')
            setProgress(80)
            break
          default:
            break
        }
      }

      async function boot() {
        try {
          const api = window.GarageLedger
          if (api?.updates?.getStatus) render(await api.updates.getStatus())
          api?.updates?.onStatus?.((p) => render(p))
          api?.updates?.check?.()
          api?.backups?.ensureDaily?.()
          setProgress(40)
        } catch {
          setStatus('Loading…')
        }
      }

      window.addEventListener('garageledger:splash-fade', () => {
        document.body.classList.add('fade-out')
      })

      boot()
    </script>
  </body>
</html>
